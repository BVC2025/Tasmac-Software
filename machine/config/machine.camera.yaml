# Demo / internal testing with a REAL camera reading REAL bottle QRs.
#   PLC: simulator (no machine yet) - press "Insert" in the kiosk DEV panel, then hold the
#        bottle in front of the camera and turn it slowly so both QRs are seen.
#   Camera: a webcam, or a phone via DroidCam / Iriun (it shows up as a webcam).
#   Backend: the real central backend; real TASMAC QRs must be registered in
#            Admin -> QR registry (unknown QRs the camera saw are listed there).
#
#   python -m rvm.main --config config/machine.camera.yaml
#   python tools/camera_check.py            # find the right camera index first
machine_id: RVM-SIM-001

plc:
  host: 127.0.0.1
  port: 5020
  lanes: 1                          # one camera = one inlet for the demo

simulator:
  enabled: true
  auto_insert_every_s: null
  bottles_file: config/sim_bottles.yaml

vision_driver: camera
camera:
  sources:
    1: 0                            # webcam / DroidCam index; or "http://<phone-ip>:4747/video"
  width: 1280
  height: 720
  frame_interval_s: 0.35
  backend: dshow                    # Windows + DroidCam; try "msmf" or "auto" if it does not open

backend_driver: http
backend:
  url: http://127.0.0.1:8000
  api_key: dev-sim-key-001
  outbox_path: data/outbox.db

customer_driver: web
local_api:
  enabled: true
  host: 127.0.0.1
  port: 8765
  cors_origins: ["http://localhost:5173"]

flow:
  customer_input_timeout_s: 120
  inspection_angles: 4
  qr_scan_max_rotations: 40         # ~15 s to show the QRs to the camera
  payout_poll_interval_s: 1.0
  payout_pending_wait_s: 10
  on_payout_pending_timeout: accept

qr:
  test_signing_secret: tasmac-test-secret-change-me
